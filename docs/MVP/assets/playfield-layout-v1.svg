<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1260" width="1000" height="1260" font-family="Helvetica, Arial, sans-serif">
  <title>BasePinball — Playfield Layout v1 (schematic)</title>
  <!-- Scale: 1 px = 1 mm. svgX = 20 + x_mm, svgY = 1210 - y_mm. Matches docs/MVP/02-playfield-design.md § 5 -->
  <defs>
    <clipPath id="pf"><path d="M20,1210 V260 A295,220 0 0 1 610,260 V1210 Z"/></clipPath>
    <polygon id="arrow" points="0,-16 11,9 0,3 -11,9"/>
  </defs>

  <rect width="1000" height="1260" fill="#0B1020"/>

  <!-- Playfield + stripes -->
  <path d="M20,1210 V260 A295,220 0 0 1 610,260 V1210 Z" fill="#2E6B34"/>
  <g clip-path="url(#pf)" fill="#367A3C">
    <rect x="0" y="40" width="640" height="60"/><rect x="0" y="160" width="640" height="60"/>
    <rect x="0" y="280" width="640" height="60"/><rect x="0" y="400" width="640" height="60"/>
    <rect x="0" y="520" width="640" height="60"/><rect x="0" y="640" width="640" height="60"/>
    <rect x="0" y="760" width="640" height="60"/><rect x="0" y="880" width="640" height="60"/>
    <rect x="0" y="1000" width="640" height="60"/>
  </g>

  <!-- Infield art (flat) + basepath windows -->
  <path d="M295,995 L150,860 Q295,560 440,860 Z" fill="#B4683C"/>
  <polygon points="295,965 405,855 295,745 185,855" fill="#2E6B34"/>
  <polyline points="295,980 420,855 295,730 170,855 295,980" fill="none" stroke="#8FD3FF" stroke-opacity="0.45" stroke-width="14" stroke-linejoin="round"/>
  <polyline points="295,980 420,855 295,730 170,855 295,980" fill="none" stroke="#F4F1E8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <rect x="413" y="848" width="14" height="14" fill="#F4F1E8" transform="rotate(45 420 855)"/>
  <rect x="288" y="723" width="14" height="14" fill="#F4F1E8" transform="rotate(45 295 730)"/>
  <rect x="163" y="848" width="14" height="14" fill="#F4F1E8" transform="rotate(45 170 855)"/>
  <polygon points="284,973 306,973 306,982 295,991 284,982" fill="#F4F1E8"/>

  <!-- Mound + pitcher post + magnet -->
  <circle cx="295" cy="855" r="24" fill="#C27A4A" stroke="#7a4a2a" stroke-width="2"/>
  <circle cx="295" cy="849" r="5" fill="#1B2A4A" stroke="#F2B33D" stroke-width="2"/>
  <circle cx="295" cy="940" r="12" fill="none" stroke="#c9a7ff" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Outer wall + shooter lane -->
  <path d="M20,1210 V260 A295,220 0 0 1 610,260 V1210" fill="none" stroke="#C9CED6" stroke-width="4"/>
  <line x1="570" y1="1210" x2="570" y2="250" stroke="#C9CED6" stroke-width="4"/>
  <rect x="580" y="1150" width="20" height="50" rx="4" fill="#C9CED6"/>

  <!-- Orbit inner guides -->
  <path d="M65,530 V300 Q65,150 185,120" fill="none" stroke="#1B2A4A" stroke-width="8" stroke-linecap="round"/>
  <path d="M525,530 V300 Q525,150 405,120" fill="none" stroke="#1B2A4A" stroke-width="8" stroke-linecap="round"/>

  <!-- Spinners -->
  <g stroke="#C9CED6" stroke-width="3">
    <line x1="22" y1="450" x2="63" y2="450"/><line x1="527" y1="450" x2="568" y2="450"/>
  </g>
  <rect x="30" y="446" width="26" height="8" fill="#E6E6E6"/>
  <rect x="534" y="446" width="26" height="8" fill="#E6E6E6"/>

  <!-- Corner kickers (TRIPLE) -->
  <path d="M38,184 A295,220 0 0 1 82,125" fill="none" stroke="#FF9F1C" stroke-width="10" stroke-linecap="round"/>
  <path d="M548,125 A295,220 0 0 1 592,184" fill="none" stroke="#FF9F1C" stroke-width="10" stroke-linecap="round"/>

  <!-- Top lanes R-B-I -->
  <g stroke="#F4F1E8" stroke-width="4" stroke-linecap="round">
    <line x1="250" y1="85" x2="250" y2="135"/><line x1="280" y1="85" x2="280" y2="135"/>
    <line x1="310" y1="85" x2="310" y2="135"/><line x1="340" y1="85" x2="340" y2="135"/>
  </g>
  <g fill="#F2B33D" font-size="13" font-weight="700" text-anchor="middle">
    <text x="265" y="116">R</text><text x="295" y="116">B</text><text x="325" y="116">I</text>
  </g>

  <!-- The Gap: pop nest -->
  <g stroke="#C9CED6" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M260,405 L205,330 L205,180 L250,180"/>
    <path d="M330,405 L385,330 L385,180 L340,180"/>
  </g>
  <circle cx="245" cy="225" r="22" fill="#3D8BFD" stroke="#ffffff" stroke-width="2"/>
  <circle cx="345" cy="225" r="22" fill="#3D8BFD" stroke="#ffffff" stroke-width="2"/>
  <circle cx="250" cy="335" r="26" fill="#F4EFE1" stroke="#ffffff" stroke-width="2"/>
  <circle cx="340" cy="335" r="26" fill="#F4EFE1" stroke="#ffffff" stroke-width="2"/>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <text x="245" y="229" fill="#ffffff">2B</text><text x="345" y="229" fill="#ffffff">2B</text>
    <text x="250" y="339" fill="#1B2A4A">1B</text><text x="340" y="339" fill="#1B2A4A">1B</text>
  </g>

  <!-- Ramps (elevated) + wireform returns -->
  <path d="M162,420 Q150,300 95,200" fill="none" stroke="#FF3B3B" stroke-opacity="0.5" stroke-width="44" stroke-linecap="round"/>
  <path d="M428,420 Q440,300 495,200" fill="none" stroke="#2EC4B6" stroke-opacity="0.5" stroke-width="44" stroke-linecap="round"/>
  <path d="M95,200 Q48,160 42,250 L42,830 Q42,858 80,868" fill="none" stroke="#C9CED6" stroke-width="5" stroke-dasharray="10 5"/>
  <path d="M495,200 Q542,160 548,250 L548,830 Q548,858 510,868" fill="none" stroke="#C9CED6" stroke-width="5" stroke-dasharray="10 5"/>
  <rect x="136" y="414" width="52" height="10" fill="#FF3B3B"/>
  <rect x="402" y="414" width="52" height="10" fill="#2EC4B6"/>
  <line x1="78" y1="214" x2="112" y2="190" stroke="#ffffff" stroke-width="4"/>

  <!-- Fielder saucers + standees -->
  <g stroke="#E6E6E6" stroke-width="2.5" fill="#0A0A0A">
    <circle cx="60" cy="610" r="20"/>
    <circle cx="105" cy="460" r="20"/>
    <circle cx="220" cy="445" r="20"/>
    <circle cx="295" cy="300" r="18"/>
    <circle cx="370" cy="445" r="20"/>
    <circle cx="485" cy="460" r="20"/>
    <circle cx="530" cy="610" r="20"/>
  </g>
  <g fill="#1B2A4A" stroke="#F2B33D" stroke-width="1.5">
    <rect x="44" y="578" width="32" height="9" rx="3"/>
    <rect x="89" y="428" width="32" height="9" rx="3"/>
    <rect x="204" y="413" width="32" height="9" rx="3"/>
    <rect x="279" y="270" width="32" height="9" rx="3"/>
    <rect x="354" y="413" width="32" height="9" rx="3"/>
    <rect x="469" y="428" width="32" height="9" rx="3"/>
    <rect x="514" y="578" width="32" height="9" rx="3"/>
  </g>
  <g fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">
    <text x="60" y="644">3B</text>
    <text x="105" y="494">LF</text>
    <text x="220" y="479">SS</text>
    <text x="320" y="300">CF</text>
    <text x="370" y="479">2B</text>
    <text x="485" y="494">RF</text>
    <text x="530" y="644">1B</text>
  </g>

  <!-- Drop targets B-A-T (left wall) + standups R-U-N (right wall) -->
  <g fill="#F2B33D" stroke="#ffffff" stroke-width="1">
    <rect x="22" y="686" width="12" height="28"/><rect x="22" y="721" width="12" height="28"/><rect x="22" y="756" width="12" height="28"/>
  </g>
  <g fill="#9B5DE5" stroke="#ffffff" stroke-width="1">
    <rect x="556" y="686" width="12" height="28"/><rect x="556" y="721" width="12" height="28"/><rect x="556" y="756" width="12" height="28"/>
  </g>
  <g fill="#F4F1E8" font-size="11" font-weight="700">
    <text x="48" y="705">T</text><text x="48" y="740">A</text><text x="48" y="775">B</text>
    <text x="550" y="705" text-anchor="end">N</text><text x="550" y="740" text-anchor="end">U</text><text x="550" y="775" text-anchor="end">R</text>
  </g>

  <!-- Insert arrows (mid-field), colored by shot result -->
  <use href="#arrow" transform="translate(118,600) rotate(-24)" fill="#FF9F1C"/>
  <use href="#arrow" transform="translate(165,585)" fill="#FF3B3B"/>
  <use href="#arrow" transform="translate(295,585)" fill="#F4EFE1"/>
  <use href="#arrow" transform="translate(425,585)" fill="#2EC4B6"/>
  <use href="#arrow" transform="translate(472,600) rotate(24)" fill="#FF9F1C"/>
  <!-- Rally meter -->
  <g fill="#F2B33D" fill-opacity="0.85">
    <circle cx="263" cy="640" r="5"/><circle cx="279" cy="640" r="5"/><circle cx="295" cy="640" r="5"/><circle cx="311" cy="640" r="5"/><circle cx="327" cy="640" r="5"/>
  </g>

  <!-- Lanes, kickback -->
  <g stroke="#C9CED6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="60" y1="870" x2="60" y2="1085"/><path d="M105,870 V1000 L195,1045"/>
    <line x1="530" y1="870" x2="530" y2="1085"/><path d="M485,870 V1000 L395,1045"/>
  </g>
  <rect x="28" y="1055" width="24" height="10" fill="#F2B33D"/>

  <!-- Slingshots -->
  <polygon points="125,880 125,985 180,1010" fill="#E9E2CF" stroke="#ffffff" stroke-width="2"/>
  <polygon points="465,880 465,985 410,1010" fill="#E9E2CF" stroke="#ffffff" stroke-width="2"/>

  <!-- Flippers -->
  <line x1="195" y1="1045" x2="264" y2="1085" stroke="#F4EFE1" stroke-width="16" stroke-linecap="round"/>
  <line x1="395" y1="1045" x2="326" y2="1085" stroke="#F4EFE1" stroke-width="16" stroke-linecap="round"/>
  <circle cx="195" cy="1045" r="4" fill="#FF3B3B"/><circle cx="395" cy="1045" r="4" fill="#FF3B3B"/>

  <!-- Apron -->
  <rect x="20" y="1110" width="550" height="100" fill="#1A2036"/>
  <ellipse cx="295" cy="1135" rx="30" ry="18" fill="#8A5A2B" stroke="#F4F1E8" stroke-width="1.5"/>
  <g fill="#F2B33D">
    <circle cx="40" cy="1185" r="7"/><circle cx="62" cy="1185" r="7"/><circle cx="84" cy="1185" r="7"/>
    <circle cx="106" cy="1185" r="7"/><circle cx="128" cy="1185" r="7"/><circle cx="150" cy="1185" r="7"/>
    <circle cx="172" cy="1185" r="7"/><circle cx="194" cy="1185" r="7"/><circle cx="216" cy="1185" r="7"/>
  </g>
  <g fill="#FF3B3B"><circle cx="460" cy="1185" r="8"/><circle cx="485" cy="1185" r="8"/><circle cx="510" cy="1185" r="8"/></g>
  <g fill="#F4F1E8" font-size="10" text-anchor="middle">
    <text x="128" y="1165">INNING 1–9</text><text x="485" y="1165">OUTS</text>
    <text x="295" y="1170">CATCHER</text><text x="295" y="1183">(drain = OUT)</text>
  </g>

  <!-- Field labels -->
  <g fill="#F4F1E8" font-size="10" text-anchor="middle">
    <text x="295" y="65">TOP ARCH · ORBIT LOOP</text>
    <text x="295" y="160">THE GAP</text>
    <text x="95" y="236" font-weight="700">HR GATE</text>
    <text x="160" y="400" font-weight="700">LEFT RAMP · HR</text>
    <text x="432" y="400" font-weight="700">RIGHT RAMP · STEAL</text>
    
    <text x="40" y="1100">FOUL</text><text x="550" y="1100">FOUL</text>
    <text x="40" y="1050">KB</text>
    <text x="295" y="895">MOUND</text>
    <text x="325" y="962">magnet</text>
    <text x="295" y="660">RALLY</text>
    <text x="34" y="400" transform="rotate(-90 34 400)">L ORBIT</text>
    <text x="555" y="400" transform="rotate(-90 555 400)">R ORBIT</text>
    <text x="594" y="900" transform="rotate(-90 594 900)">SHOOTER LANE</text>
  </g>

  <!-- Title + legend -->
  <g fill="#F4F1E8">
    <text x="650" y="60" font-size="22" font-weight="700">BasePinball</text>
    <text x="650" y="84" font-size="14">Playfield layout v1 — schematic</text>
    <text x="650" y="104" font-size="11" fill="#9AA6C4">1 px = 1 mm · 590 × 1170 mm · slope 6.5°</text>
  </g>
  <g font-size="13" fill="#F4F1E8">
    <text x="650" y="148" font-weight="700" font-size="14">Legend</text>
    <circle cx="664" cy="176" r="10" fill="#0A0A0A" stroke="#E6E6E6" stroke-width="2.5"/>
    <text x="684" y="181">Fielder saucer — OUT (7)</text>
    <circle cx="664" cy="206" r="10" fill="#F4EFE1"/>
    <text x="684" y="211">Gap pop (front) — SINGLE</text>
    <circle cx="664" cy="236" r="10" fill="#3D8BFD"/>
    <text x="684" y="241">Gap pop (back) — DOUBLE</text>
    <line x1="654" y1="266" x2="674" y2="266" stroke="#FF9F1C" stroke-width="8" stroke-linecap="round"/>
    <text x="684" y="271">Orbit corner kicker — TRIPLE</text>
    <rect x="654" y="288" width="20" height="14" fill="#FF3B3B" fill-opacity="0.6"/>
    <text x="684" y="300">Left ramp "Over the Wall" — HOME RUN</text>
    <rect x="654" y="318" width="20" height="14" fill="#2EC4B6" fill-opacity="0.6"/>
    <text x="684" y="330">Right ramp — STEAL (feature)</text>
    <rect x="658" y="346" width="10" height="20" fill="#F2B33D"/>
    <text x="684" y="361">B-A-T drop targets — HOT BAT</text>
    <rect x="658" y="376" width="10" height="20" fill="#9B5DE5"/>
    <text x="684" y="391">R-U-N standups — light STEAL</text>
    <rect x="652" y="414" width="24" height="7" fill="#E6E6E6"/>
    <text x="684" y="421">Spinner (orbits)</text>
    <line x1="654" y1="446" x2="674" y2="446" stroke="#C9CED6" stroke-width="4" stroke-dasharray="6 3"/>
    <text x="684" y="451">Wireform return → inlane</text>
    <ellipse cx="664" cy="476" rx="12" ry="8" fill="#8A5A2B"/>
    <text x="684" y="481">Center drain — STRIKEOUT (out)</text>
    <text x="650" y="511" font-weight="700">FOUL</text>
    <text x="700" y="511">Outlanes — FOUL OUT · KB = kickback</text>
    <line x1="654" y1="536" x2="674" y2="536" stroke="#8FD3FF" stroke-opacity="0.6" stroke-width="10"/>
    <text x="684" y="541">Basepath windows (runners under glass)</text>
    <circle cx="664" cy="566" r="10" fill="#C27A4A"/>
    <text x="684" y="571">Mound — pitch saucer + pitcher post</text>
    <use href="#arrow" transform="translate(664,598) scale(0.7)" fill="#F4EFE1"/>
    <text x="684" y="603">Insert arrows (colored by result)</text>
    <polygon points="656,618 656,640 674,644" fill="#E9E2CF"/>
    <text x="684" y="637">Slingshots ("dugouts")</text>
  </g>
  <g font-size="13" fill="#F4F1E8">
    <text x="650" y="680" font-weight="700" font-size="14">Shot fan (left → right)</text>
    <text x="650" y="706">1  Left orbit → TRIPLE → loops into the Gap</text>
    <text x="650" y="728">2  Left ramp → HOME RUN → left inlane</text>
    <text x="650" y="750">3  The Gap → SINGLE / DOUBLE (CF inside)</text>
    <text x="650" y="772">4  Right ramp → STEAL → right inlane</text>
    <text x="650" y="794">5  Right orbit → TRIPLE → loops to left</text>
    <text x="650" y="816">6  B-A-T drops · 7  R-U-N standups</text>
  </g>
  <g font-size="12" fill="#9AA6C4">
    <text x="650" y="860">Fielders sit in the gaps between shots:</text>
    <text x="650" y="878">miss your shot and they catch it.</text>
    <text x="650" y="904">v1 positions — tuned in whitebox (M1).</text>
    <text x="650" y="922">Ramps and wireforms are elevated.</text>
  </g>
</svg>
